{# P10: nút Nhắn tin. Dùng class nút có sẵn (README_GIAO_DIEN mục 3), không tự viết CSS. #}
{% if kieu == 'form' %}
  <form method="post" action="{% url 'khoi_tao_cuoc_tro_chuyen' ma_nhiep_anh_gia %}" onsubmit="this.querySelector('button').classList.add('is-loading')">{# POST + CSRF; is-loading theo README giao diện #}
    {% csrf_token %}
    <button class="btn btn--secondary" type="submit">Nhắn tin</button>
  </form>
{% elif kieu == 'dang_nhap' %}
  <a class="btn btn--secondary" href="{{ url_dang_nhap }}">Nhắn tin</a>{# chưa đăng nhập: sang đăng nhập rồi quay lại #}
{% endif %}
