{# {% include "includes/alert.html" with level="success" title="..." text="..." dismissible=True %}  level: success | danger | warning | info #}
<div class="alert alert--{{ level|default:'info' }}" role="{% if level == 'danger' or level == 'warning' %}alert{% else %}status{% endif %}">
  <div class="alert__body">
    {% if title %}<strong class="alert__title">{{ title }}</strong>{% endif %}
    <span class="alert__text">{{ text }}</span>
  </div>
  {% if dismissible %}<button class="alert__close" type="button" data-dismiss aria-label="Đóng thông báo">×</button>{% endif %}
</div>
