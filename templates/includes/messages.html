{% load buoc_ke %}{% if messages %}
<div class="container flash">

    {% include "includes/alert.html" with level=message.level_tag text=message dismissible=True action_url=nut.url action_label=nut.nhan %}
    {% endwith %}
  {% endfor %}
</div>
{% endif %}
